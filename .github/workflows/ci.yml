name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tools/check.py
      - run: python3 -m pip install -r tools/requirements-tests.txt
      - run: python3 -m unittest discover -s tests
      - name: Test C# progress logic
        shell: pwsh
        run: ./tools/test-core.ps1
      - name: Test actual media loader with engine and network doubles
        shell: pwsh
        run: ./tools/test-media.ps1
      - run: python3 tools/package_source.py
